<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мой Аквариум</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0a1628 0%,#0d2137 50%,#0a1628 100%);color:#e0f0ff;min-height:100vh;padding-bottom:90px}
.header{background:linear-gradient(135deg,#006994,#0099cc);padding:20px 16px 16px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 4px 20px rgba(0,153,204,.3)}
.header h1{font-size:22px;color:#fff;margin-bottom:4px}
.header p{font-size:13px;color:rgba(255,255,255,.7)}
.stats{display:flex;gap:10px;padding:12px 16px}
.stat-card{flex:1;background:rgba(255,255,255,.06);border-radius:16px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.stat-card .num{font-size:24px;font-weight:700;color:#4dd9ff}
.stat-card .lbl{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.entries{padding:0 16px}
.entry-card{background:rgba(255,255,255,.07);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.08);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.entry-date{font-size:11px;color:#4dd9ff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.entry-text{font-size:14px;line-height:1.5;color:#e0f0ff;white-space:pre-wrap}
.entry-photo{margin-top:10px;border-radius:12px;overflow:hidden}
.entry-photo img{width:100%;display:block;border-radius:12px}
.del-btn{background:none;border:none;color:#ff6b6b;font-size:18px;cursor:pointer;padding:4px}
.fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#0099cc,#006994);color:#fff;font-size:28px;border:none;box-shadow:0 4px 20px rgba(0,153,204,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.92)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#132a43;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:20px 16px 30px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:18px;margin-bottom:16px;color:#fff;text-align:center}
.modal textarea{width:100%;height:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px;color:#e0f0ff;font-size:15px;resize:none;font-family:inherit}
.modal textarea:focus{outline:none;border-color:#4dd9ff}
.voice-btn{width:100%;padding:14px;border-radius:12px;border:2px dashed rgba(77,217,255,.4);background:rgba(77,217,255,.08);color:#4dd9ff;font-size:15px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.voice-btn.recording{border-color:#ff6b6b;background:rgba(255,107,107,.1);color:#ff6b6b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.photo-btn{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e0f0ff;font-size:14px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.photo-preview{max-width:100%;border-radius:12px;margin-bottom:12px;display:none}
.save-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#0099cc,#006994);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.save-btn:active{transform:scale(.97)}
.cancel-btn{width:100%;padding:12px;border-radius:12px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:14px;cursor:pointer;margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.4)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.category-select{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cat-btn{padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:12px;cursor:pointer;transition:all .2s}
.cat-btn.active{background:rgba(77,217,255,.15);border-color:#4dd9ff;color:#4dd9ff}
</style>
</head>
<body>

<div class="header">
<h1>🐠 Мой Аквариум</h1>
<p>Дневник наблюдений</p>
</div>

<div class="stats">
<div class="stat-card"><div class="num" id="totalEntries">0</div><div class="lbl">записей</div></div>
<div class="stat-card"><div class="num" id="totalDays">0</div><div class="lbl">дней</div></div>
<div class="stat-card"><div class="num" id="totalPhotos">0</div><div class="lbl">фото</div></div>
</div>

<div class="entries" id="entriesList"></div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
<div class="modal">
<h2>✍️ Новая запись</h2>

<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
<span id="voiceIcon">🎤</span>
<span id="voiceText">Нажми и говори</span>
</button>

<div class="category-select">
<button class="cat-btn active" data-cat="Общее" onclick="setCat(this)">🐟 Общее</button>
<button class="cat-btn" data-cat="Вода" onclick="setCat(this)">💧 Вода</button>
<button class="cat-btn" data-cat="Рыбы" onclick="setCat(this)">🐠 Рыбы</button>
<button class="cat-btn" data-cat="Растения" onclick="setCat(this)">🌿 Растения</button>
<button class="cat-btn" data-cat="Оборудование" onclick="setCat(this)">⚙️ Оборудование</button>
</div>

<textarea id="entryText" placeholder="Наговори или напиши: температура, состояние рыб, внешний вид аквариума..."></textarea>

<button class="photo-btn" onclick="document.getElementById('photoInput').click()">📷 Прикрепить фото</button>
<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
<img class="photo-preview" id="photoPreview">

<button class="save-btn" onclick="saveEntry()">💾 Сохранить</button>
<button class="cancel-btn" onclick="closeModal()">Отмена</button>
</div>
</div>

<script>
let entries=JSON.parse(localStorage.getItem('aquaEntries')||'[]');
let currentPhoto=null;
let recognition=null;
let isRecording=false;
let currentCat='Общее';

const catIcons={'Общее':'🐟','Вода':'💧','Рыбы':'🐠','Растения':'🌿','Оборудование':'⚙️'};

function init(){render();updateStats()}

function updateStats(){
document.getElementById('totalEntries').textContent=entries.length;
const days=new Set(entries.map(e=>e.date.split(',')[0])).size;
document.getElementById('totalDays').textContent=days;
const photos=entries.filter(e=>e.photo).length;
document.getElementById('totalPhotos').textContent=photos;
}

function render(){
const list=document.getElementById('entriesList');
if(entries.length===0){
list.innerHTML='<div class="empty"><div class="icon">🐠</div><p>Пока нет записей.<br>Нажми «+» чтобы добавить первую!</p></div>';
return;
}
list.innerHTML=entries.map((e,i)=>`
<div class="entry-card">
<div class="entry-date">
<span>${catIcons[e.cat]||'🐟'} ${e.cat} · ${e.date}</span>
<button class="del-btn" onclick="deleteEntry(${i})">🗑</button>
</div>
<div class="entry-text">${e.text}</div>
${e.photo?`<div class="entry-photo"><img src="${e.photo}" loading="lazy"></div>`:''}
</div>
`).join('');
}

function openModal(){
document.getElementById('modalOverlay').classList.add('active');
document.getElementById('entryText').value='';
document.getElementById('photoPreview').style.display='none';
currentPhoto=null;
}

function closeModal(){
document.getElementById('modalOverlay').classList.remove('active');
if(isRecording)stopVoice();
}

function closeModalOutside(e){
if(e.target===e.currentTarget)closeModal();
}

function setCat(btn){
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentCat=btn.dataset.cat;
}

function toggleVoice(){
if(isRecording){stopVoice();return}
if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){
alert('К сожалению, твой браузер не поддерживает голосовой ввод. Попробуй Chrome.');
return;
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
recognition=new SR();
recognition.lang='ru-RU';
recognition.interimResults=false;
recognition.continuous=false;
recognition.onstart=()=>{
isRecording=true;
document.getElementById('voiceBtn').classList.add('recording');
document.getElementById('voiceIcon').textContent='🔴';
document.getElementById('voiceText').textContent='Слушаю... Говори!';
};
recognition.onresult=(e)=>{
const text=e.results[0][0].transcript;
const ta=document.getElementById('entryText');
ta.value=ta.value?ta.value+' '+text:text;
};
recognition.onerror=(e)=>{
stopVoice();
if(e.error==='not-allowed')alert('Нужно разрешить доступ к микрофону. Зайди в настройки браузера и разреши.');
};
recognition.onend=()=>stopVoice();
recognition.start();
}

function stopVoice(){
isRecording=false;
if(recognition){recognition.stop();recognition=null}
document.getElementById('voiceBtn').classList.remove('recording');
document.getElementById('voiceIcon').textContent='🎤';
document.getElementById('voiceText').textContent='Нажми и говори';
}

function handlePhoto(input){
if(!input.files||!input.files[0])return;
const file=input.files[0];
const reader=new FileReader();
reader.onload=(e)=>{
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
const maxW=800;
let w=img.width,h=img.height;
if(w>maxW){h=h*(maxW/w);w=maxW}
canvas.width=w;canvas.height=h;
canvas.getContext('2d').drawImage(img,0,0,w,h);
currentPhoto=canvas.toDataURL('image/jpeg',0.7);
const preview=document.getElementById('photoPreview');
preview.src=currentPhoto;
preview.style.display='block';
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}

function saveEntry(){
const text=document.getElementById('entryText').value.trim();
if(!text&&!currentPhoto){alert('Наговори что-нибудь или прикрепи фото');return}
const now=new Date();
const date=now.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+', '+now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
entries.unshift({text,photo:currentPhoto,date,cat:currentCat});
try{
localStorage.setItem('aquaEntries',JSON.stringify(entries));
}catch(e){
alert('Память заполнена. Удали старые записи с фото.');
entries.shift();
return;
}
closeModal();
render();
updateStats();
}

function deleteEntry(i){
if(confirm('Удалить эту запись?')){
entries.splice(i,1);
localStorage.setItem('aquaEntries',JSON.stringify(entries));
render();
updateStats();
}
}

init();
</script>
</body>
  </html>
